<!DOCTYPE html>
<html>
<head>
    <title>Student Result Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f4f7f9; min-height:100vh; display:flex; align-items:center;}</style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4 text-primary">Check Your Result</h3>
                    <div id="error" class="alert alert-danger d-none">Invalid Reg No or Password</div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label>Registration Number</label>
                            <input type="text" id="reg_no" class="form-control" placeholder="STU001" required>
                        </div>
                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" id="password" class="form-control" placeholder="password123" required>
                        </div>
                        <button class="btn btn-primary w-100">View Result</button>
                    </form>
                    <small class="text-muted">Demo: STU001 / password123</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const reg_no = document.getElementById('reg_no').value;
    const password = document.getElementById('password').value;
    
    fetch('students.json')
    .then(res => res.json())
    .then(data => {
        const student = data.students.find(s => s.reg_no === reg_no && s.password === password);
        if(student){
            localStorage.setItem('student', JSON.stringify(student));
            window.location.href = 'result.html';
        } else {
            document.getElementById('error').classList.remove('d-none');
        }
    });
});
</script>
</body>
</html>
