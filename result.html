<!DOCTYPE html>
<html>
<head>
    <title>My Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h4>STUDENT RESULT PORTAL</h4>
            <p id="sessionTerm">2025/2026 - First Term</p>
        </div>
        <div class="card-body">
            <p><b>Name:</b> <span id="name"></span> | <b>Reg No:</b> <span id="reg"></span> | <b>Class:</b> <span id="class"></span></p>
            
            <table class="table table-bordered text-center">
                <thead class="table-dark">
                    <tr><th>Subject</th><th>Test</th><th>Exam</th><th>Total</th><th>Grade</th></tr>
                </thead>
                <tbody id="resultTable"></tbody>
            </table>

            <div class="alert alert-info">
                <b>Total:</b> <span id="total"></span> | <b>Average:</b> <span id="avg"></span>%
            </div>
            <a href="index.html" class="btn btn-secondary">Logout</a>
            <button onclick="window.print()" class="btn btn-success">Print</button>
        </div>
    </div>
</div>

<script>
function getGrade(total){
    if(total >= 70) return 'A';
    if(total >= 60) return 'B';
    if(total >= 50) return 'C';
    if(total >= 40) return 'D';
    return 'F';
}

const student = JSON.parse(localStorage.getItem('student'));
if(!student) window.location.href = 'index.html';

document.getElementById('name').innerText = student.full_name;
document.getElementById('reg').innerText = student.reg_no;
document.getElementById('class').innerText = student.class;

let totalScore = 0;
let tbody = '';
student.results.forEach(r => {
    const total = r.test + r.exam;
    const grade = getGrade(total);
    totalScore += total;
    tbody += `<tr>
        <td>${r.subject}</td>
        <td>${r.test}</td>
        <td>${r.exam}</td>
        <td><b>${total}</b></td>
        <td><b>${grade}</b></td>
    </tr>`;
});
document.getElementById('resultTable').innerHTML = tbody;
document.getElementById('total').innerText = totalScore;
document.getElementById('avg').innerText = (totalScore / student.results.length).toFixed(2);
</script>
</body>
</html>
